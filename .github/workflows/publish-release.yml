name: Publish downloadable package

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          NAME="ShogiCpp11"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/$NAME"
          # Package source tree; keep engine exe, drop git/workflow metadata.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            ./ "$STAGE/$NAME/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$NAME.zip" "$NAME")
          ls -lh "$NAME.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="download"
          NOTES="Auto-built from the \`release\` branch ($(git rev-parse --short HEAD)).
          Unzip and open \`Shogi.cbp\` in Code::Blocks (working dir = project root)."
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" "ShogiCpp11.zip" \
            --title "ShogiCpp11 — downloadable package" \
            --notes "$NOTES" \
            --target release \
            --latest
