name: Publish downloadable package

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW + SDL2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            zip
            mingw-w64-x86_64-binutils

      - name: Build Shogi.exe (Release)
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++11 -O2 -Wall -Isrc \
            src/main.cpp src/core/*.cpp src/ui/*.cpp \
            -o build/Shogi.exe \
            -lmingw32 -lSDL2main -lSDL2 -lSDL2_image -lSDL2_ttf \
            -lcomdlg32 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 \
            -lversion -luuid -lsetupapi
          ls -lh build/Shogi.exe
          # Windows path of the toolchain that linked this exe. The player zip
          # copies DLLs from here so the game runs without MinGW or SDL2 installed.
          cygpath -w "${MINGW_PREFIX}/bin" > build/mingw-bin.txt
          test -f "${MINGW_PREFIX}/bin/SDL2.dll"
          test -f "${MINGW_PREFIX}/bin/SDL2_image.dll"
          test -f "${MINGW_PREFIX}/bin/SDL2_ttf.dll"
          test -f "${MINGW_PREFIX}/bin/objdump.exe"

      - name: Stage player zip (no source)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'player'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          Copy-Item 'build/Shogi.exe' (Join-Path $root 'Shogi.exe')

          Copy-Item -Recurse 'assets' (Join-Path $root 'assets')
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'engine') | Out-Null
          Copy-Item 'engine/fairy-stockfish-largeboard_x86-64-modern.exe' `
            (Join-Path $root 'engine/fairy-stockfish-largeboard_x86-64-modern.exe')

          # DLLs come from the same MinGW prefix that linked Shogi.exe (written by
          # the build step). Players do not have that toolchain; the zip ships
          # every non-system DLL the exe and those DLLs import.
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path 'build/mingw-bin.txt')) {
            throw 'build/mingw-bin.txt missing; the build step must record the MinGW bin path'
          }
          $mingwBin = (Get-Content 'build/mingw-bin.txt' -Raw).Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $mingwBin 'SDL2.dll'))) {
            throw "SDL2.dll not in recorded MinGW bin: $mingwBin"
          }
          Write-Host "MinGW bin: $mingwBin"
          $objdump = Join-Path $mingwBin 'objdump.exe'
          $system32 = Join-Path $env:SystemRoot 'System32'

          function Get-PeImports([string]$path) {
            $names = New-Object System.Collections.Generic.List[string]
            foreach ($line in (& $objdump -p $path 2>&1)) {
              if ($line -match 'DLL Name:\s+(\S+)') {
                $names.Add($Matches[1])
              }
            }
            return $names
          }

          $copied = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          $queue = New-Object System.Collections.Generic.Queue[string]
          $queue.Enqueue((Join-Path $root 'Shogi.exe'))
          while ($queue.Count -gt 0) {
            $mod = $queue.Dequeue()
            $modLeaf = Split-Path $mod -Leaf
            foreach ($dll in (Get-PeImports $mod)) {
              if ($copied.Contains($dll)) { continue }
              $src = Join-Path $mingwBin $dll
              if (Test-Path -LiteralPath $src) {
                Copy-Item -LiteralPath $src -Destination (Join-Path $root $dll) -Force
                [void]$copied.Add($dll)
                $queue.Enqueue((Join-Path $root $dll))
              } elseif ($dll -match '^(?i)(api-ms-win-|ext-ms-)') {
                # API set. The loader resolves it; there is no file to ship.
              } elseif (-not (Test-Path -LiteralPath (Join-Path $system32 $dll))) {
                throw "Required DLL not in MinGW bin or System32: $dll (imported by $modLeaf)"
              }
            }
          }

          foreach ($must in @('SDL2.dll', 'SDL2_image.dll', 'SDL2_ttf.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $must))) {
              throw "Player package is missing $must"
            }
          }
          Write-Host "Bundled $($copied.Count) DLLs"
          $copied | Sort-Object | ForEach-Object { Write-Host "  $_" }

          @"
          Shogi — Windows player package
          ==============================
          Double-click Shogi.exe.
          MinGW and SDL2 do not need to be installed. Their DLLs are in this folder.

          Keep this folder together: Shogi.exe, the .dll files, assets\, and engine\.
          The program uses the folder that contains Shogi.exe.
          "@.Trim() | Set-Content -Encoding utf8 (Join-Path $root 'README.txt')

          # Sanity: no source / tests / docs leaked into the player tree.
          $banned = @('src','tests','docs','tools','Shogi.cbp','Doxyfile','.github')
          foreach ($b in $banned) {
            if (Test-Path (Join-Path $root $b)) { throw "player package must not contain $b" }
          }

          Get-ChildItem $root | Format-Table Name, Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'ShogiCpp11-windows.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          if (Test-Path (Join-Path $root 'Shogi.bat')) { throw 'player package must not contain Shogi.bat' }
          # $false => entries at archive root (Shogi.exe / DLLs / assets / …)
          [System.IO.Compression.ZipFile]::CreateFromDirectory($root, $zipPath, 'Optimal', $false)
          Get-Item $zipPath | Format-List FullName, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'download'
          $short = (git rev-parse --short HEAD).Trim()
          $notes = @"
          Auto-built from the ``release`` branch (``$short``).

          ### Assets
          - **ShogiCpp11-windows.zip** — player package (no source, no MinGW or SDL2 install). Unzip, double-click ``Shogi.exe``. Includes ``assets/``, Fairy-Stockfish under ``engine/``, and the DLLs the exe needs.
          - **Source code (zip)** / **Source code (tar.gz)** — full repository snapshot for this tag (build with Code::Blocks / MinGW; see README).
          "@
          gh release delete $tag --yes 2>$null
          git push origin ":refs/tags/$tag" 2>$null
          gh release create $tag 'ShogiCpp11-windows.zip' `
            --title 'ShogiCpp11 — downloadable package' `
            --notes $notes `
            --target release `
            --latest
